<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CubeForge Labs — Ship content at the speed of thought</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-core: #8763e5;
    --purple-light: #d79de4;
    --purple-deep: #53099d;
    --black: #000000;
    --font: 'Inter Tight', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:#fff;
    color:#000;
    font-family:var(--font);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    letter-spacing:-0.01em;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit; text-decoration:none;}
  img,svg{display:block; max-width:100%;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  .wrap{max-width:1240px; margin:0 auto; padding:0 40px;}

  /* fluid cursor canvas */
  #fluid-canvas{
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:0;
  }

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(0,0,0,0.06);
  }
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 40px; max-width:1240px; margin:0 auto;
  }
  .logo{display:flex; align-items:center; gap:2px; font-weight:800; font-size:22px; letter-spacing:-0.02em;}
  .logo .cube-icon{width:20px; height:20px; margin:0 1px;}
  .logo .suffix{color:var(--purple-core);}
  .nav-links{display:flex; align-items:center; gap:34px; font-size:15px; color:rgba(0,0,0,0.7);}
  .nav-links a{display:flex; align-items:center; gap:4px;}
  .nav-links a:hover{color:#000;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 22px; border-radius:999px;
    font-size:14.5px; font-weight:600; font-family:var(--font);
    cursor:pointer; border:none;
    transition:background .15s ease, transform .15s ease;
  }
  .btn-black{background:#000; color:#fff;}
  .btn-black:hover{background:rgba(0,0,0,0.85);}
  .btn-purple{background:var(--purple-core); color:#fff;}
  .btn-purple:hover{background:#7550d9;}
  .btn-light{background:rgba(0,0,0,0.04); color:#000;}
  .btn-light:hover{background:rgba(0,0,0,0.07);}
  @media (max-width: 900px){ .nav-links{display:none;} }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    flex:1;
    min-height:80vh;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:80px 40px 120px;
    overflow:hidden;
  }
  .hero-content{position:relative; z-index:2; max-width:900px;}
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:14px; font-weight:600; color:rgba(0,0,0,0.55);
    margin-bottom:26px;
  }
  .hero-eyebrow .cube-icon{width:18px; height:18px;}
  .hero-eyebrow .suffix{color:var(--purple-core);}

  h1{
    font-size:clamp(42px, 6vw, 76px);
    font-weight:700;
    letter-spacing:-0.03em;
    line-height:1.06;
    margin-bottom:40px;
  }
  h1 .word{
    display:inline-block;
    background:linear-gradient(90deg, var(--purple-deep), var(--purple-core) 45%, var(--purple-light));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; transform:translateY(18px);
    animation:riseIn 0.7s cubic-bezier(.2,.7,.2,1) forwards;
  }

  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }

  .hero-cta{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .btn-lg{padding:15px 28px; font-size:15px;}

  /* ---------- MAINTENANCE PANEL ---------- */
  .maintenance{
    background:#08060c;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:100px 24px;
    position:relative;
    overflow:hidden;
  }
  .maintenance .glow{
    position:absolute;
    top:50%; left:50%;
    width:700px; height:700px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(135,99,229,0.16) 0%, rgba(215,157,228,0.06) 45%, transparent 70%);
    pointer-events:none;
  }
  .maintenance-content{position:relative; z-index:1; max-width:640px;}
  .maintenance-dot{
    width:14px; height:14px; border-radius:50%;
    background:var(--purple-core);
    box-shadow:0 0 0 8px rgba(135,99,229,0.22);
    margin:0 auto 30px;
  }
  .maintenance h2{
    font-size:clamp(26px, 3.6vw, 34px);
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.5;
    color:rgba(255,255,255,0.9);
    max-width:560px;
    margin:0 auto;
  }
  .maintenance h2 .lead{color:#fff; font-weight:800;}
  .maintenance h2 .mail{display:block; margin-top:6px;}
  .maintenance h2 .mail a{
    background:linear-gradient(90deg, var(--purple-core), var(--purple-light));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight:700;
  }
</style>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="logo">
      Cubef<svg class="cube-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z" fill="url(#cubeGradNav)"/><path d="M12 2v20M3 7l9 5 9-5" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/><defs><linearGradient id="cubeGradNav" x1="3" y1="2" x2="21" y2="22"><stop stop-color="#8763e5"/><stop offset="1" stop-color="#d79de4"/></linearGradient></defs></svg>rge<span class="suffix">Labs</span>
    </a>
    <div class="nav-links">
      <a href="#">Product</a>
      <a href="#">Solutions</a>
      <a href="#">AI Studio</a>
      <a href="#">Resources</a>
    </div>
    <a href="#" class="btn btn-black">Get Started <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></a>
  </nav>
</header>

<section class="hero">
  <canvas id="fluid-canvas"></canvas>
  <div class="hero-content">
    <div class="hero-eyebrow">
      <svg class="cube-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z" fill="url(#cubeGradEyebrow)"/><defs><linearGradient id="cubeGradEyebrow" x1="3" y1="2" x2="21" y2="22"><stop stop-color="#8763e5"/><stop offset="1" stop-color="#d79de4"/></linearGradient></defs></svg>
      Cubeforge<span class="suffix">Labs</span>
    </div>
    <h1>
      <span class="word" style="animation-delay:0.05s">Ship</span>
      <span class="word" style="animation-delay:0.12s">content</span>
      <span class="word" style="animation-delay:0.19s">at</span>
      <span class="word" style="animation-delay:0.26s">the</span>
      <span class="word" style="animation-delay:0.33s">speed</span>
      <span class="word" style="animation-delay:0.4s">of</span><br>
      <span class="word" style="animation-delay:0.5s">thought</span>
    </h1>
    <div class="hero-cta">
      <a href="#" class="btn btn-black btn-lg">Start Creating</a>
      <a href="#" class="btn btn-light btn-lg">Explore Agents</a>
    </div>
  </div>
</section>

<section class="maintenance">
  <div class="glow"></div>
  <div class="maintenance-content">
    <div class="maintenance-dot"></div>
    <h2>
      <span class="lead">Site under maintenance</span> — some features may be temporarily unavailable. For any queries, contact
      <span class="mail"><a href="mailto:info@cubeforgelabs.com">info@cubeforgelabs.com</a></span>
    </h2>
  </div>
</section>

<script>
  // Simplified fluid-style cursor trail (glowing purple splats fading over time)
  (function(){
    const canvas = document.getElementById('fluid-canvas');
    const heroSection = canvas.closest('.hero');
    const ctx = canvas.getContext('2d');
    let w, h, dpr;
    const splats = [];
    const colors = ['#8763e5', '#d79de4', '#53099d'];
    let lastX = null, lastY = null;
    let reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = heroSection.clientWidth;
      h = heroSection.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    heroSection.addEventListener('mousemove', (e)=>{
      if (reduced) return;
      const rect = heroSection.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const dist = lastX !== null ? Math.hypot(x-lastX, y-lastY) : 0;
      if (dist > 6 || lastX === null){
        splats.push({
          x, y,
          r: 4,
          maxR: 40 + Math.random()*30,
          life: 1,
          color: colors[Math.floor(Math.random()*colors.length)]
        });
        lastX = x; lastY = y;
      }
      if (splats.length > 60) splats.splice(0, splats.length - 60);
    });
    heroSection.addEventListener('mouseleave', ()=>{ lastX = null; lastY = null; });

    function hexToRgb(hex){
      const v = parseInt(hex.slice(1),16);
      return [(v>>16)&255, (v>>8)&255, v&255];
    }

    function tick(){
      ctx.clearRect(0,0,w,h);
      for (let i = splats.length-1; i >= 0; i--){
        const s = splats[i];
        s.r += (s.maxR - s.r) * 0.08;
        s.life -= 0.012;
        if (s.life <= 0){ splats.splice(i,1); continue; }
        const [r,g,b] = hexToRgb(s.color);
        const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
        grad.addColorStop(0, `rgba(${r},${g},${b},${0.28*s.life})`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    if (!reduced) tick();
  })();
</script>

</body>
</html>
